<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Weimar — the Reichsadler reduced to a stamp: near-black eagle on the
       republic's gold, chunky stepped wings so the mark keeps identity at
       23px header size. A seal, not heraldry — the deck is a memorial. -->
  <circle cx="50" cy="50" r="48" fill="#C9A227"/>
  <g fill="#23201B">
    <!-- spread wings: three stepped feather tiers each side -->
    <path d="M14 38h26v8H14zM18 50h22v8H18zM24 62h16v8H24z"/>
    <path d="M60 38h26v8H60zM60 50h22v8H60zM60 62h16v8H60z"/>
    <!-- body -->
    <rect x="42" y="34" width="16" height="40" rx="3"/>
    <!-- tail notches -->
    <path d="M42 74h16l-3 8h-3l-2 5-2-5h-3z"/>
    <!-- head, facing left, with beak -->
    <circle cx="50" cy="27" r="9"/>
    <path d="M41 25l-8 3 8 4z"/>
  </g>
</svg>
