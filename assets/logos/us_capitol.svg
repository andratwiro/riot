<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- US Congress — the Capitol dome as a roundel: paper-white dome on Old Glory
       blue, chunky shapes so the mark keeps identity at 23px header size. -->
  <circle cx="50" cy="50" r="48" fill="#3C3B6E"/>
  <g fill="#FBFAF6">
    <!-- Freedom (finial) -->
    <circle cx="50" cy="20" r="3"/>
    <rect x="48.6" y="22" width="2.8" height="5"/>
    <!-- tholos (lantern) -->
    <rect x="43.5" y="27" width="13" height="6" rx="1"/>
    <!-- dome -->
    <path d="M31 57c0-15 8.5-23 19-23s19 8 19 23z"/>
    <!-- cornice under the dome -->
    <rect x="28" y="57" width="44" height="4" rx="1"/>
    <!-- colonnade -->
    <rect x="31" y="63" width="4.5" height="9"/>
    <rect x="39.5" y="63" width="4.5" height="9"/>
    <rect x="48" y="63" width="4.5" height="9"/>
    <rect x="56.5" y="63" width="4.5" height="9"/>
    <rect x="65" y="63" width="4.5" height="9"/>
    <!-- base + steps -->
    <rect x="25" y="73" width="50" height="5" rx="1"/>
    <rect x="20" y="79" width="60" height="4.5" rx="1"/>
  </g>
</svg>
