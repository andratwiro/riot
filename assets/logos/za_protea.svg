<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- South Africa — the king protea (the national flower) as a roundel:
       paper-white bract fan + flower dome on flag green, chunky shapes so the
       mark keeps identity at 23px header size. -->
  <circle cx="50" cy="50" r="48" fill="#007749"/>
  <g fill="#FBFAF6">
    <!-- bract fan -->
    <polygon points="39.0,61.2 16.7,54.9 39.7,58.2"/>
    <polygon points="40.5,56.5 23.2,41.1 42.4,54.1"/>
    <polygon points="43.8,52.9 35.1,31.4 46.6,51.5"/>
    <polygon points="48.5,51.1 50.0,28.0 51.5,51.1"/>
    <polygon points="53.4,51.5 64.9,31.4 56.2,52.9"/>
    <polygon points="57.6,54.1 76.8,41.1 59.5,56.5"/>
    <polygon points="60.3,58.2 83.3,54.9 61.0,61.2"/>
    <!-- flower dome (flat-bottomed) -->
    <path d="M35 64c0-9.5 6.7-15.5 15-15.5S65 54.5 65 64z"/>
    <!-- calyx + stem -->
    <rect x="38" y="64" width="24" height="4" rx="2"/>
    <rect x="47.4" y="68" width="5.2" height="16" rx="2.4"/>
  </g>
</svg>
