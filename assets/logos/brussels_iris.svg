<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Brussels iris — the region's emblem as a roundel: bold yellow iris on
       flag blue, so the mark keeps contrast and identity at 23px header size. -->
  <circle cx="50" cy="50" r="48" fill="#1F4FA5"/>
  <g fill="#F8C81C">
    <!-- standard (central petal) -->
    <path d="M50 12c11.5 13.5 11.5 32.5 0 46.5C38.5 44.5 38.5 25.5 50 12z"/>
    <!-- left fall -->
    <path d="M46 61C31 60 19 50 14 35c-1-3 1-5 4-4 14 5 25 15 30 28 .5 1.2-.5 2.1-2 2z"/>
    <!-- right fall -->
    <path d="M54 61c15-1 27-11 32-26 1-3-1-5-4-4-14 5-25 15-30 28-.5 1.2.5 2.1 2 2z"/>
    <!-- stem -->
    <path d="M46 58h8v23c0 2.2-1.8 3.5-4 3.5s-4-1.3-4-3.5z"/>
  </g>
</svg>
