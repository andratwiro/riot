<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- House of Commons — the portcullis as a roundel: paper-white gate on
       Commons green, chunky bars so the mark keeps identity at 23px header
       size (the crowned brand mark is protected; this is the plain gate). -->
  <circle cx="50" cy="50" r="48" fill="#006E46"/>
  <g fill="#FBFAF6">
    <!-- chain rings -->
    <circle cx="26" cy="24" r="6.5" fill="none" stroke="#FBFAF6" stroke-width="4"/>
    <circle cx="74" cy="24" r="6.5" fill="none" stroke="#FBFAF6" stroke-width="4"/>
    <!-- vertical bars, spiked feet -->
    <path d="M30 30h7v44l-3.5 8-3.5-8z"/>
    <path d="M46.5 30h7v44L50 82l-3.5-8z"/>
    <path d="M63 30h7v44l-3.5 8-3.5-8z"/>
    <!-- horizontal bars -->
    <rect x="22" y="36" width="56" height="6"/>
    <rect x="22" y="50" width="56" height="6"/>
    <rect x="22" y="64" width="56" height="6"/>
  </g>
</svg>
