<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIOT.REUS</title>
<style>
  :root{
    --bg:#0e1014; --card:#1b1f27; --card2:#222732; --line:#2b313c;
    --ink:#f0f2f6; --dim:#9aa1ad; --acc:#6db3ff;
    --for:#27b66a; --against:#e5485f; --abstain:#9aa1ad;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:680px;margin:0 auto}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px 8px;flex:0 0 auto}
  .brand{font-weight:800;letter-spacing:.5px;font-size:17px}
  .brand span{color:var(--dim);font-weight:500;font-size:13px;margin-left:6px}
  .gear{background:none;border:0;color:var(--dim);cursor:pointer;padding:0;border-radius:8px;font-size:20px;line-height:1;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .gear:hover{color:var(--ink);background:var(--card)}

  /* affinity bar */
  #affinity{display:flex;gap:6px;padding:6px 12px 12px;flex:0 0 auto}
  .pa{flex:1 1 0;min-width:0;text-align:center}
  .pa .lg{width:36px;height:36px;border-radius:50%;margin:0 auto 4px;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--line)}
  .pa .lg img{width:100%;height:100%;object-fit:contain;padding:4px}
  .pa .lg.fb{color:#fff;font-weight:800;font-size:13px;border:0}
  /* brand-colour backfill so logo squares blend into the circle (no white corners) */
  .lg.bg-PSC,#map .mc.bg-PSC{background:#e2001a}
  .lg.bg-CUP,#map .mc.bg-CUP{background:#fff200}
  .pa .track{height:4px;border-radius:3px;background:var(--line);margin-top:2px;overflow:hidden}
  .pa .fill{height:100%;width:0;border-radius:3px;transition:width .4s ease}
  .pa.muted{opacity:.45}

  /* opinion map (experimental) */
  #map{position:relative;flex:0 0 auto;height:150px;margin:0 12px 8px;
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    background:radial-gradient(circle at 50% 50%,rgba(109,179,255,.06),transparent 68%),var(--card)}
  #map .axis{position:absolute;background:var(--line);opacity:.55}
  #map .axis.x{left:8%;right:8%;top:50%;height:1px}
  #map .axis.y{top:8%;bottom:8%;left:50%;width:1px}
  .mdot{position:absolute;transform:translate(-50%,-50%);
    transition:left .55s cubic-bezier(.2,.7,.3,1),top .55s cubic-bezier(.2,.7,.3,1),opacity .4s}
  .mdot .mc{width:26px;height:26px;border-radius:50%;background:#fff;overflow:hidden;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--line);
    box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .mdot .mc img{width:100%;height:100%;object-fit:contain;padding:3px}
  .mdot .mc.fb{color:#fff;font-weight:800;font-size:9px;border:0}
  .mdot.me{z-index:4}
  .mdot.me .mc{width:32px;height:32px;background:var(--acc);color:#06121f;
    border-color:#fff;font-weight:800;font-size:11px;box-shadow:0 0 0 4px rgba(109,179,255,.22),0 2px 10px rgba(0,0,0,.5)}
  #map .maptag{position:absolute;top:6px;left:10px;font-size:9.5px;letter-spacing:.4px;
    text-transform:uppercase;color:var(--dim);font-weight:700;z-index:5;pointer-events:none}
  #map .maphint{position:absolute;left:0;right:0;bottom:7px;text-align:center;
    font-size:11px;color:var(--dim);font-weight:600;z-index:5;pointer-events:none}

  /* survey / card stack */
  #survey{flex:1 1 auto;position:relative;padding:6px 16px 0;min-height:0}
  .progress{text-align:center;color:var(--dim);font-size:12.5px;margin-bottom:8px}
  .stack{position:relative;margin:0 auto}
  .card{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:22px 22px 18px;display:flex;flex-direction:column;
    box-shadow:0 18px 50px rgba(0,0,0,.4);
    transition:transform .38s cubic-bezier(.2,.7,.3,1),opacity .38s}
  /* behind cards sit absolutely behind the (in-flow) top card, which sizes the stack */
  .card.behind1,.card.behind2{position:absolute;inset:0}
  .card .topic{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;color:var(--acc);background:rgba(109,179,255,.12);
    padding:4px 10px;border-radius:999px}
  .card h2{font-size:25px;line-height:1.4;margin:14px 0 10px;font-weight:450;letter-spacing:-.01em}
  .card .body{color:#d4d8e0;font-size:15px}
  .card .stake{margin-top:10px;color:var(--dim);font-size:13px;border-left:2px solid var(--line);padding-left:10px}
  .more{align-self:flex-start;margin:4px 0 0;background:none;border:0;color:var(--acc);
    font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 0}
  .card .reveal{margin-top:10px;max-height:42vh;overflow:auto}
  .card .reveal[hidden]{display:none}
  .card.behind1{transform:scale(.95) translateY(14px);opacity:.6;filter:saturate(.6)}
  .card.behind2{transform:scale(.9) translateY(28px);opacity:.3;filter:saturate(.3)}
  .card.gone-r{transform:translateX(120%) rotate(8deg);opacity:0}
  .card.gone-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
  .card.gone-d{transform:translateY(120%);opacity:0}

  /* in-card vote buttons */
  .acts{display:flex;gap:10px;margin-top:auto;padding-top:16px;flex:0 0 auto}
  .btn{flex:1;border:0;border-radius:14px;padding:15px 8px;font-size:15px;font-weight:700;
    cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;
    transition:transform .08s}
  .btn:active{transform:scale(.96)}
  .btn.f{background:var(--for)} .btn.a{background:var(--against)} .btn.ab{background:#39404d}

  /* done screen */
  #done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:30px}
  #done h2{font-size:24px;margin:0 0 6px}
  #done p{color:var(--dim);margin:4px 0 18px;font-size:14px}
  #done .closest{font-size:15px;margin:8px 0 22px}
  .restart{background:var(--card2);border:1px solid var(--line);color:var(--ink);
    padding:12px 20px;border-radius:12px;font-size:14px;cursor:pointer}

  /* log overlay */
  #log{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;overflow:auto;padding:0 0 40px}
  #log .lh{position:sticky;top:0;background:rgba(14,16,20,.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  #log .lwrap{max-width:760px;margin:0 auto;padding:16px 18px}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .lcard .lt{font-weight:600;font-size:14px}
  .lcard .lm{color:var(--dim);font-size:12px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
  .b-app{background:rgba(39,182,106,.16);color:#5fd58c}
  .b-rej{background:rgba(229,72,95,.16);color:#f08197}
  .b-kind{background:rgba(255,255,255,.08);color:#9aa3b2}
  .lvotes{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .pchip{font-size:11px;padding:3px 8px;border-radius:7px;border:1px solid var(--line);display:flex;gap:5px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%}
  .d-for{background:var(--for)} .d-against{background:var(--against)} .d-abstain{background:var(--abstain)}
  .d-split,.d-absent{background:#6b7280}
  .lraw{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:9px;font-size:11.5px;color:#c2c8d2;white-space:pre-wrap}
  .lcard a.src{color:var(--acc);font-size:11.5px;text-decoration:none}
  .muted{color:var(--dim)}
  details summary{cursor:pointer;color:var(--dim);font-size:11.5px;margin-top:8px;outline:none}

  /* card "original" mode tag */
  .card .topic.orig{color:#f0b46d;background:rgba(240,180,109,.14)}
  .card .body.rawtxt{font-size:13px;color:#c2c8d2;white-space:pre-wrap}

  /* bottom sheet menu */
  #sheet{position:fixed;inset:0;z-index:30;display:none}
  #sheet.open{display:block}
  .sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .28s}
  #sheet.open .sheet-back{opacity:1}
  .sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;
    background:var(--card);border-top-left-radius:22px;border-top-right-radius:22px;
    border-top:1px solid var(--line);padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.7,.3,1);
    box-shadow:0 -18px 50px rgba(0,0,0,.5)}
  #sheet.open .sheet-panel{transform:translateY(0)}
  .sheet-grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
  .sheet-panel h3{margin:0 0 4px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);font-weight:700;padding:0 4px}
  .sheet-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--card2);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-top:10px;color:var(--ink);cursor:pointer;font:inherit}
  .sheet-item:active{transform:scale(.99)}
  .si-ic{font-size:20px;line-height:1;flex:0 0 auto}
  .si-tx{flex:1 1 auto;min-width:0}
  .si-tx b{display:block;font-size:15px;font-weight:650}
  .si-tx small{display:block;color:var(--dim);font-size:12px;margin-top:2px;line-height:1.35}
  .si-go{color:var(--dim);font-size:15px;flex:0 0 auto}
  .switch{position:relative;width:46px;height:27px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .2s}
  .slider::before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:transform .2s}
  .switch input:checked + .slider{background:var(--acc)}
  .switch input:checked + .slider::before{transform:translateX(19px)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">RIOT.REUS</div>
    <button class="gear" id="menuBtn" title="Opcions">⚙</button>
  </header>

  <div id="affinity"></div>

  <div id="map"></div>

  <div id="survey">
    <div class="progress" id="progress"></div>
    <div class="stack" id="stack"></div>
    <div id="done">
      <h2>Ja està 🎉</h2>
      <p id="doneSub"></p>
      <div class="closest" id="closest"></div>
      <button class="restart" id="restart">Torna a començar</button>
      <p style="margin-top:18px;font-size:12px">Res no s'ha desat. En recarregar, s'esborra tot.</p>
    </div>
  </div>

</div>

<div id="log">
  <div class="lh">
    <div><b>Dades originals</b> <span class="muted" id="logCount"></span></div>
    <button class="gear" id="closeLog" title="Torna a les targetes">⚙</button>
  </div>
  <div class="lwrap">
    <p class="muted" style="font-size:12.5px;margin-top:0">
      Totes les decisions extretes de les actes del Ple, amb el vot real de cada partit i el text
      literal de la font. Aquesta és la capa verificable: cada targeta de l'enquesta surt d'aquí.
    </p>
    <div id="logList"></div>
  </div>
</div>

<div id="sheet" aria-hidden="true">
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet-panel" role="dialog" aria-label="Opcions">
    <div class="sheet-grab"></div>
    <h3>Opcions</h3>
    <button class="sheet-item" id="openLog">
      <span class="si-ic">📄</span>
      <span class="si-tx"><b>Dades originals</b><small>El registre del Ple amb el vot real i el text literal de cada acta.</small></span>
      <span class="si-go">↗</span>
    </button>
    <label class="sheet-item" for="origToggle">
      <span class="si-ic">🔁</span>
      <span class="si-tx"><b>Text original a les targetes</b><small>Mostra el títol i el text oficial de l'acta en lloc de la versió simplificada.</small></span>
      <span class="switch"><input type="checkbox" id="origToggle"><span class="slider"></span></span>
    </label>
  </div>
</div>

<script src="data.js"></script>
<script>
const R = window.RIOT || {decisions:[], parties:[]};
const PARTIES = R.parties || [];
const $ = s => document.querySelector(s);
const VLAB = {for:"a favor", against:"en contra", abstain:"abstenció", split:"dividit", absent:"absent"};
// Structural kind labels (raw view only). Non-votable kinds never reach the card deck.
const KLAB = {dictamen:"Dictamen", proposicio:"Proposició", mocio:"Moció", ratificacio:"Ratificació",
  declaracio:"Declaració", donar_compte:"Donar compte", info:"Informació", acta:"Acta",
  prec:"Prec", pregunta:"Pregunta", altres:"Altres"};
const byId = Object.fromEntries(R.decisions.map(d=>[d.id,d]));

// cards = real decisions only: explained AND structurally votable (votable===false => raw view only)
let deck = shuffle(R.decisions.filter(d => d.headline && d.votable !== false));
let idx = 0;
let useOriginal = false;
const answers = {};
const MAP_GATE = 5;          // votes required before the user is placed on the map
let COORD = null, MX = {}, mapBuilt = false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function affinity(){
  const res={};
  for(const p of PARTIES){
    let comp=0,match=0;
    for(const id in answers){
      const pv=(byId[id].party_votes_canon||{})[p.token];
      if(pv==="for"||pv==="against"||pv==="abstain"){comp++; if(pv===answers[id])match++;}
    }
    res[p.token]=comp?{pct:Math.round(100*match/comp),comp}:{pct:null,comp:0};
  }
  return res;
}
function logoEl(p){
  return p.logo ? `<span class="lg bg-${p.token}"><img src="${p.logo}" alt="${p.name}"></span>`
                : `<span class="lg fb" style="background:${p.color}">${p.token}</span>`;
}
function renderAffinity(){
  const a=affinity();
  const order=PARTIES.slice().sort((x,y)=>{
    const px=a[x.token].pct,py=a[y.token].pct;
    if(px===null&&py===null)return 0; if(px===null)return 1; if(py===null)return -1; return py-px;
  });
  $("#affinity").innerHTML=order.map(p=>{
    const r=a[p.token],pct=r.pct;
    return `<div class="pa ${r.comp?'':'muted'}" title="${esc(p.name)}">${logoEl(p)}
      <div class="track"><div class="fill" style="width:${pct||0}%;background:${p.color}"></div></div>
    </div>`;
  }).join("");
}

/* ---- opinion map (experimental) ---- */
// Jacobi eigensolver for a symmetric matrix → {values, vectors(columns)}
function jacobi(Ain){
  const n=Ain.length;
  const a=Ain.map(r=>r.slice());
  const V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let sweep=0;sweep<100;sweep++){
    let off=0;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)off+=a[i][j]*a[i][j];
    if(off<1e-12)break;
    for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){
      if(Math.abs(a[p][q])<1e-15)continue;
      const theta=0.5*Math.atan2(2*a[p][q],a[p][p]-a[q][q]);
      const c=Math.cos(theta),s=Math.sin(theta);
      for(let i=0;i<n;i++){const aip=a[i][p],aiq=a[i][q];a[i][p]=c*aip-s*aiq;a[i][q]=s*aip+c*aiq;}
      for(let j=0;j<n;j++){const apj=a[p][j],aqj=a[q][j];a[p][j]=c*apj-s*aqj;a[q][j]=s*apj+c*aqj;}
      for(let i=0;i<n;i++){const vip=V[i][p],viq=V[i][q];V[i][p]=c*vip-s*viq;V[i][q]=s*vip+c*viq;}
    }
  }
  return {values:a.map((r,i)=>r[i]),vectors:V};
}
// classical MDS of parties from pairwise vote-disagreement distance
function partyMap(){
  const ps=PARTIES,n=ps.length;
  const num=v=>v==="for"?1:v==="against"?-1:v==="abstain"?0:null;
  const D2=Array.from({length:n},()=>Array(n).fill(0));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    let s=0,c=0;
    for(const d of R.decisions){
      const pv=d.party_votes_canon||{};
      const vi=num(pv[ps[i].token]),vj=num(pv[ps[j].token]);
      if(vi==null||vj==null)continue;
      s+=Math.abs(vi-vj)/2;c++;
    }
    const dist=c?s/c:0.5;
    D2[i][j]=D2[j][i]=dist*dist;
  }
  const rm=Array(n).fill(0);let gm=0;
  for(let i=0;i<n;i++){for(let j=0;j<n;j++)rm[i]+=D2[i][j];rm[i]/=n;gm+=rm[i];}
  gm/=n;
  const B=Array.from({length:n},()=>Array(n).fill(0));
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)B[i][j]=-0.5*(D2[i][j]-rm[i]-rm[j]+gm);
  const {values,vectors}=jacobi(B);
  const ord=values.map((_,i)=>i).sort((x,y)=>values[y]-values[x]);
  const k1=ord[0],k2=ord[1];
  const s1=Math.sqrt(Math.max(0,values[k1])),s2=Math.sqrt(Math.max(0,values[k2]));
  return PARTIES.map((_,i)=>[vectors[i][k1]*s1,vectors[i][k2]*s2]);
}
// user position = agreement-weighted blend of party positions
function userCoord(){
  const a=affinity();
  let wx=0,wy=0,wsum=0;
  PARTIES.forEach((p,i)=>{
    const r=a[p.token];
    if(!r.comp)return;
    const w=Math.pow(r.pct/100,2);
    wx+=w*COORD[i][0];wy+=w*COORD[i][1];wsum+=w;
  });
  return wsum>1e-6?[wx/wsum,wy/wsum]:null;
}
function toPct(c){
  const pad=.17;
  const nx=(c[0]-MX.minx)/((MX.maxx-MX.minx)||1);
  const ny=(c[1]-MX.miny)/((MX.maxy-MX.miny)||1);
  return [(pad+nx*(1-2*pad))*100,(pad+(1-ny)*(1-2*pad))*100];
}
function buildMapBase(){
  const dots=PARTIES.map((p,i)=>{
    const [l,t]=toPct(COORD[i]);
    const inner=p.logo?`<span class="mc bg-${p.token}"><img src="${p.logo}" alt="${esc(p.name)}"></span>`
                      :`<span class="mc fb" style="background:${p.color}">${p.token}</span>`;
    return `<div class="mdot" style="left:${l}%;top:${t}%" title="${esc(p.name)}">${inner}</div>`;
  }).join("");
  $("#map").innerHTML=`<span class="maptag">Mapa polític · prova</span>
    <div class="axis x"></div><div class="axis y"></div>
    ${dots}
    <div class="mdot me" id="userDot" style="opacity:0"><span class="mc fb">TU</span></div>
    <div class="maphint" id="mapHint"></div>`;
  mapBuilt=true;
}
function renderMap(){
  if(!COORD)return;
  if(!mapBuilt)buildMapBase();
  const n=Object.keys(answers).length;
  const ud=$("#userDot"),hint=$("#mapHint");
  const uc=n>=MAP_GATE?userCoord():null;
  if(uc){const [l,t]=toPct(uc);ud.style.left=l+"%";ud.style.top=t+"%";ud.style.opacity="1";}
  else ud.style.opacity="0";
  if(uc){hint.style.display="none";}
  else{
    hint.style.display="block";
    const left=MAP_GATE-n;
    hint.textContent=n>=MAP_GATE?"Vota més per situar-t'hi"
      :`Reacciona ${left} cop${left===1?'':'s'} més per situar-t'hi`;
  }
}

function renderStack(){
  const stack=$("#stack");
  if(idx>=deck.length){finish();return;}
  $("#progress").textContent=`${idx+1} de ${deck.length}`;
  stack.innerHTML="";
  for(let k=Math.min(idx+2,deck.length-1);k>=idx;k--){
    const d=deck[k],depth=k-idx;
    const el=document.createElement("div");
    el.className="card"+(depth===1?" behind1":depth===2?" behind2":"");
    const topic = useOriginal ? esc(d.organ||d.type||"Acta") : esc(d.topic||"Decisió");
    const head  = useOriginal ? esc(d.title||d.headline) : esc(d.headline);
    const body  = useOriginal
      ? `<div class="body rawtxt">${esc(d.raw_outcome||d.title||"")}</div>`
      : `<div class="body">${esc(d.human_body||"")}${d.stake?`<div class="stake">${esc(d.stake)}</div>`:""}</div>`;
    const acts = depth===0
      ? `<div class="acts">
          <button class="btn a" data-v="against">En contra</button>
          <button class="btn ab" data-v="abstain">Abstenció</button>
          <button class="btn f" data-v="for">A favor</button>
        </div>`
      : "";
    el.innerHTML=`<span class="topic${useOriginal?" orig":""}">${topic}</span>
      <h2>${head}</h2>
      <button class="more" type="button">Veure més ▾</button>
      <div class="reveal" hidden>${body}</div>
      ${acts}`;
    stack.appendChild(el);
  }
}
function react(vote){
  if(idx>=deck.length)return;
  answers[deck[idx].id]=vote;
  const top=$("#stack").lastChild;
  if(top)top.classList.add(vote==="for"?"gone-r":vote==="against"?"gone-l":"gone-d");
  renderAffinity();
  renderMap();
  setTimeout(()=>{idx++;renderStack();},230);
}
function finish(){
  $("#stack").innerHTML=""; $("#progress").textContent="";
  const a=affinity();
  const ranked=PARTIES.filter(p=>a[p.token].comp).sort((x,y)=>a[y.token].pct-a[x.token].pct);
  $("#doneSub").textContent=`Has reaccionat a ${Object.keys(answers).length} decisions.`;
  $("#closest").innerHTML=ranked.length
    ?`Ara mateix, el teu partit més afí: <b style="color:${ranked[0].color}">${ranked[0].name}</b> (${a[ranked[0].token].pct}%)`:"";
  $("#done").style.display="flex";
}

$("#stack").addEventListener("click",e=>{
  const more=e.target.closest(".more");
  if(more){
    const rev=more.closest(".card").querySelector(".reveal");
    const open=rev.hasAttribute("hidden");
    if(open){rev.removeAttribute("hidden");more.textContent="Veure menys ▴";}
    else{rev.setAttribute("hidden","");more.textContent="Veure més ▾";}
    return;
  }
  const vb=e.target.closest(".btn[data-v]");
  if(vb)react(vb.dataset.v);
});
document.addEventListener("keydown",e=>{
  if($("#sheet").classList.contains("open")||$("#log").style.display==="block")return;
  if(e.key==="ArrowLeft")react("against");
  else if(e.key==="ArrowRight")react("for");
  else if(e.key==="ArrowDown")react("abstain");
});
$("#restart").addEventListener("click",()=>{
  deck=shuffle(R.decisions.filter(d=>d.headline && d.votable !== false)); idx=0;
  for(const k in answers)delete answers[k];
  $("#done").style.display="none";
  renderAffinity(); renderStack(); renderMap();
});

function buildLog(){
  $("#logCount").textContent=`· ${R.n_decisions} decisions · ${(R.sessions_in_table||[]).length} sessions`;
  const rows=R.decisions.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  $("#logList").innerHTML=rows.map(d=>{
    const out=d.outcome==="rejected"?'<span class="badge b-rej">REBUTJAT</span>':'<span class="badge b-app">APROVAT</span>';
    const kind=d.kind?`<span class="badge b-kind">${KLAB[d.kind]||d.kind}${d.votable===false?" · no es vota":""}</span>`:"";
    const chips=Object.entries(d.party_votes_canon||{}).map(([k,v])=>`<span class="pchip"><span class="dot d-${v}"></span>${k} ${VLAB[v]||v}</span>`).join("");
    return `<div class="lcard">
      <div class="lt">${esc(d.headline||d.title)}</div>
      <div class="lm"><span>${d.date||""}</span><span>${d.session_code} · punt ${d.point??"?"}</span><span>${esc(d.topic||"")}</span>${kind}${d.votable===false?"":out}</div>
      <div class="muted" style="font-size:12px;margin-top:6px">${esc(d.title||"")}</div>
      <div class="lvotes">${chips}</div>
      <details><summary>text literal de l'acta + font</summary>
        <div class="lraw">${esc(d.raw_outcome||"—")}</div>
        ${d.acta_url?`<div style="margin-top:7px"><a class="src" href="${d.acta_url}" target="_blank" rel="noopener">↗ obrir l'acta (PDF)</a></div>`:""}
      </details></div>`;
  }).join("");
}
function openSheet(){$("#sheet").classList.add("open");$("#sheet").setAttribute("aria-hidden","false");}
function closeSheet(){$("#sheet").classList.remove("open");$("#sheet").setAttribute("aria-hidden","true");}
function openLog(){if(!$("#logList").innerHTML)buildLog(); $("#log").style.display="block";}

$("#menuBtn").addEventListener("click",openSheet);
$("#sheetBack").addEventListener("click",closeSheet);
$("#openLog").addEventListener("click",()=>{closeSheet();openLog();});
$("#closeLog").addEventListener("click",()=>$("#log").style.display="none");
$("#origToggle").addEventListener("change",e=>{useOriginal=e.target.checked;renderStack();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();$("#log").style.display="none";}});

if(PARTIES.length>=3 && R.decisions.length){
  COORD=partyMap();
  const xs=COORD.map(c=>c[0]),ys=COORD.map(c=>c[1]);
  MX={minx:Math.min(...xs),maxx:Math.max(...xs),miny:Math.min(...ys),maxy:Math.max(...ys)};
}else{ $("#map").style.display="none"; }

renderAffinity();
renderStack();
renderMap();
</script>
</body>
</html>
